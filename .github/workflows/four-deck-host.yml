name: Four-deck host contracts

on:
  workflow_dispatch:
  push:
    branches: [four-deck-hardware, four-deck-seamless]
  pull_request:
    paths:
      - 'source/xdj-xz-toolkit/mods/**'
      - 'source/xdj-xz-toolkit/builder/**'
      - 'tools/verify_four_deck.py'
      - 'tools/prepare_four_deck.py'
      - 'tools/check_four_deck_music.py'
      - 'tools/*timing_trial*'
      - 'tools/tests/test_timing_trial.py'
      - 'tools/tests/test_four_deck_music.py'
      - '.github/workflows/four-deck-host.yml'

permissions:
  contents: read

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pycdlib==1.20.0 cryptography==48.0.0
      - run: python tools/verify_four_deck.py --output four-deck-build/host
      - name: Four-track export checks
        run: python -m unittest discover -s tools/tests -p test_four_deck_music.py -v
      - name: Timing trial pairing contracts
        run: python -m unittest discover -s tools/tests -p test_timing_trial.py -v
      - name: Builder contracts
        working-directory: source/xdj-xz-toolkit
        env:
          TMPDIR: ${{ runner.temp }}
        run: python -m unittest builder.tests.test_firmware builder.tests.test_quad_payload builder.tests.test_current_settings -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-deck-host-${{ matrix.os }}
          path: |
            four-deck-build/host/*.log
            four-deck-build/host/verification.json

  arm-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pyelftools==0.33 capstone==5.0.9
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabi qemu-user
      - name: Pinned Zig 0.16.0
        shell: bash
        run: |
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/zig.tar.xz" https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          python - "$RUNNER_TEMP/zig.tar.xz" <<'PY'
          import hashlib, pathlib, sys
          assert hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest() == '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00'
          PY
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
      - name: Link development runtime and inspect ARM32 artifacts
        shell: bash
        run: |
          python source/xdj-xz-toolkit/mods/build.py --zig "$RUNNER_TEMP/zig-x86_64-linux-0.16.0/zig" --arm-gcc arm-linux-gnueabi-gcc --diary-version 0.5.1-seamless.1 --output four-deck-build/arm-runtime > arm-build.log 2>&1
      - name: Build paired bridge and run ARM lifecycle self-test
        run: python tools/build_timing_trial_bridge.py --runtime four-deck-build/arm-runtime/libxz-mods-development.so --zig "$RUNNER_TEMP/zig-x86_64-linux-0.16.0/zig" --output four-deck-build/timing-bridge
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-deck-arm-development
          path: |
            arm-build.log
            four-deck-build/arm-runtime/*.json
            four-deck-build/arm-runtime/*.so
            four-deck-build/timing-bridge/*
